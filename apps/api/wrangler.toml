name = "nekase"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Web 版(apps/mobile を `pnpm build:web` で書き出した dist)を、静的アセットとして配信する。
# /v1/* と /health だけを、この Worker(Hono)が処理する。それ以外は静的ファイルを返し、
# 存在しないパスは index.html を返す(SPA)。
[assets]
directory = "../mobile/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/v1/*", "/health"]

# D1。database_id は、ステップ7で `wrangler d1 create` したときの値に入れ替える。
# (アカウント ID や database_id を、チャットや Pull Request に貼らない)
[[d1_databases]]
binding = "DB"
database_name = "nekase"
database_id = "b5701876-dbda-4703-adf0-357a28ece5b0"
migrations_dir = "migrations"

# Workers AI(FX の「AI にまかせる」。計画書 §6.6)。Workers の中からだけ呼ぶ。
# 費用: Workers の無料プランのままなら、無料枠(1 日 10,000 ニューロン)を超えた分はエラーになり、課金されない。
# 止めたいとき(緊急): [vars] に AI_DISABLED = "1" を入れてデプロイすると、AI を呼ばなくなる。
# ローカルの `wrangler dev` でも、実際の Workers AI につながる(要ログイン・利用分が課金対象になりうる)。
[ai]
binding = "AI"
